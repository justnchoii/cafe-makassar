version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: cafe-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cafe-network

  # MinIO Object Storage (untuk gambar)
  minio:
    image: minio/minio
    container_name: cafe-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - cafe-network

  # Backend API (Express.js)
  backend:
    build: ./backend
    container_name: cafe-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/cafe_makassar
      - PORT=5000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=cafe-images
      - OLLAMA_API_URL=https://ollama.if.unismuh.ac.id/api/api/generate
    depends_on:
      - mongo
      - minio
    networks:
      - cafe-network

  # Frontend (Next.js)
  frontend:
    build: ./frontend
    container_name: cafe-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - cafe-network

volumes:
  mongo_data:
  minio_data:

networks:
  cafe-network:
    driver: bridge
